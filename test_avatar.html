<!DOCTYPE html>
<html>
<head>
    <title>Avatar Random Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        #profile {
            border: 1px solid #ddd;
            padding: 20px;
            max-width: 500px;
        }
        img.avatar.avatar-circle {
            width: 400px !important;
            height: 400px !important;
            object-fit: cover !important;
        }
    </style>
</head>
<body>
    <h1>Random Avatar Test</h1>
    <p>Refresh the page multiple times to see the avatar change randomly</p>
    
    <div id="profile">
        <img class="avatar avatar-circle" width="270" height="270" 
             src="/authors/admin/avatar_hu86ccd83c8608d26f2a740658555d4497_1653535_270x270_fill_q75_lanczos_center.jpg" 
             alt="Yufan Du">
    </div>

    <p>Expected avatar path: /images/avatars/avatar[1-3].jpg</p>
    <p>Check the browser console (F12) for debug messages</p>

    <!-- Inline script to run IMMEDIATELY in head -->
    <script>
      // Store selected avatar in sessionStorage so we use the same one on refresh
      (function() {
        const avatars = [
          "/images/avatars/avatar1.jpg",
          "/images/avatars/avatar2.jpg",
          "/images/avatars/avatar3.jpg",
        ];
        
        let selectedAvatar = sessionStorage.getItem("selected_avatar");
        if (!selectedAvatar) {
          selectedAvatar = avatars[Math.floor(Math.random() * avatars.length)];
          sessionStorage.setItem("selected_avatar", selectedAvatar);
        }
        
        window.__selectedAvatar = selectedAvatar;
        console.log("Selected avatar:", selectedAvatar);
      })();
    </script>

    <script>
      (function () {
        const avatars = [
          "/images/avatars/avatar1.jpg",
          "/images/avatars/avatar2.jpg",
          "/images/avatars/avatar3.jpg",
        ];

        if (!avatars.length) return;

        function setRandomAvatar() {
          const img = document.querySelector("img.avatar.avatar-circle");

          if (!img) {
            console.log("Avatar image not found!");
            return;
          }

          // Use the pre-selected avatar from sessionStorage
          const randomAvatar = window.__selectedAvatar || avatars[Math.floor(Math.random() * avatars.length)];

          console.log(`Current src: ${img.src}`);
          console.log(`Setting avatar to: ${randomAvatar}`);
          
          // Use setAttribute instead of property assignment
          img.setAttribute("src", randomAvatar);
          img.removeAttribute("srcset");
          
          // Set width and height attributes
          img.setAttribute("width", "400");
          img.setAttribute("height", "400");
          
          // Also force via style
          img.style.cssText = `
            width: 400px !important;
            height: 400px !important;
            object-fit: cover !important;
          `;
          
          console.log(`New src: ${img.src}`);
        }

        // Run at every critical timing
        function runSetAvatar() {
          setRandomAvatar();
          setTimeout(setRandomAvatar, 50);
          setTimeout(setRandomAvatar, 150);
          setTimeout(setRandomAvatar, 300);
          setTimeout(setRandomAvatar, 600);
          setTimeout(setRandomAvatar, 1000);
          setTimeout(setRandomAvatar, 2000);
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", runSetAvatar);
        }
        
        if (document.readyState !== "loading") {
          runSetAvatar();
        }
        
        window.addEventListener("load", runSetAvatar);
      })();
    </script>
</body>
</html>
