<style>
  /* Hide the original avatar immediately before it renders */
  img.avatar.avatar-circle {
    content: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg"></svg>') !important;
    background-color: #f0f0f0;
    width: 400px !important;
    height: 400px !important;
    object-fit: cover !important;
    object-position: center !important;
  }
</style>

<script>
  (function () {
    const avatars = [
      "/images/avatars/avatar1.jpg",
      "/images/avatars/avatar2.jpg",
      "/images/avatars/avatar3.jpg",
    ];

    if (!avatars.length) return;

    // Pick a random avatar - fresh every page load
    const randomIndex = Math.floor(Math.random() * avatars.length);
    const selectedAvatar = avatars[randomIndex];
    
    console.log("[Avatar] Random index:", randomIndex);
    console.log("[Avatar] Selected avatar:", selectedAvatar);

    function setRandomAvatar() {
      const img = document.querySelector("img.avatar.avatar-circle");
      if (!img) {
        console.log("[Avatar] Not found, retrying...");
        return false;
      }

      console.log("[Avatar] Found element, old src:", img.src);
      
      // Replace src immediately and forcefully
      img.src = selectedAvatar;
      img.srcset = "";
      img.sizes = "";
      
      // Also use setAttribute
      img.setAttribute("src", selectedAvatar);
      img.removeAttribute("srcset");
      
      // Force dimensions
      img.style.width = "400px";
      img.style.height = "400px";
      img.style.objectFit = "cover";
      
      console.log("[Avatar] New src:", img.src);
      return true;
    }

    // Keep trying until we find the element
    let attempts = 0;
    const maxAttempts = 100;
    
    function trySetAvatar() {
      if (setRandomAvatar() || attempts > maxAttempts) {
        console.log("[Avatar] Success or max attempts reached");
        // Run a few more times for good measure
        setTimeout(setRandomAvatar, 100);
        setTimeout(setRandomAvatar, 300);
        return;
      }
      attempts++;
      setTimeout(trySetAvatar, 10);
    }

    // Start trying immediately
    trySetAvatar();
  })();
</script>
