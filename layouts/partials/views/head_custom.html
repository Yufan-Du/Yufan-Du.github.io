<style>
  /* Forces the author's name (admin) to be black and bold, overriding the link's default blue color. */
  .pub-authors b a {
    color: #212529 !important; /* Forces the link color to be black/dark grey */
    font-weight: 600 !important; /* Ensures it stays bold */
  }
</style>


<script>
  (function () {
    // 1) List of avatar image URLs
    const avatars = [
      "/images/avatars/avatar1.jpg",
      "/images/avatars/avatar2.jpg",
      "/images/avatars/avatar3.jpg",
      // add more if you want
    ];

    if (!avatars.length) return;

    function setRandomAvatar() {
      // 2) Try several common selectors Hugo Blox/Academic uses
      const candidates = [
        document.querySelector("img.avatar.avatar-circle"),
        document.querySelector("img.avatar-circle"),
        document.querySelector("img.avatar"),
        document.querySelector(".avatar img"),
        document.querySelector(".avatar-wrapper img"),
        document.querySelector(".profile-avatar img"),
        document.querySelector("img[alt='avatar']"),
        document.querySelector("img[alt='Avatar']"),
        document.querySelector(".authors-info img"),
        document.querySelector(".author-profile-img"),
        // More specific selectors for Academic theme
        document.querySelector(".col-md-4 img.avatar-circle"),
        document.querySelector("[class*='hero'] img.avatar")
      ];

      const img = candidates.find(el => el);

      if (!img) {
        console.log("Random avatar: no avatar <img> found. Checking all img elements...");
        const allImgs = document.querySelectorAll("img");
        console.log(`Found ${allImgs.length} total img elements`);
        allImgs.forEach((el, idx) => {
          console.log(`[${idx}] src="${el.src}" class="${el.className}" alt="${el.alt}"`);
        });
        return;
      }

      console.log(`Found avatar element: class="${img.className}" src="${img.src}"`);
      
      const randomIndex = Math.floor(Math.random() * avatars.length);
      const randomAvatar = avatars[randomIndex];

      console.log(`Setting avatar to: ${randomAvatar}`);
      img.src = randomAvatar;
      // Clear srcset to avoid browser picking old versions
      if (img.srcset !== undefined) {
        img.srcset = "";
      }
    }

    // 3) Run AFTER everything is loaded so the theme can't overwrite us
    if (document.readyState === "complete") {
      setRandomAvatar();
    } else {
      window.addEventListener("load", setRandomAvatar);
    }
  })();
</script>
