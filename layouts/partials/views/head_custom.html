<style>
  /* Forces the author's name (admin) to be black and bold, overriding the link's default blue color. */
  .pub-authors b a {
    color: #212529 !important; /* Forces the link color to be black/dark grey */
    font-weight: 600 !important; /* Ensures it stays bold */
  }
</style>


<style>
  /* Increase avatar size for better quality display */
  img.avatar.avatar-circle {
    width: 400px !important;
    height: 400px !important;
    object-fit: cover !important;
  }
</style>

<!-- Inline script to run IMMEDIATELY in head -->
<script>
  // Store selected avatar in sessionStorage so we use the same one on refresh
  (function() {
    const avatars = [
      "/images/avatars/avatar1.jpg",
      "/images/avatars/avatar2.jpg",
      "/images/avatars/avatar3.jpg",
    ];
    
    let selectedAvatar = sessionStorage.getItem("selected_avatar");
    if (!selectedAvatar) {
      selectedAvatar = avatars[Math.floor(Math.random() * avatars.length)];
      sessionStorage.setItem("selected_avatar", selectedAvatar);
    }
    
    window.__selectedAvatar = selectedAvatar;
    console.log("Selected avatar:", selectedAvatar);
  })();
</script>

<script>
  (function () {
    const avatars = [
      "/images/avatars/avatar1.jpg",
      "/images/avatars/avatar2.jpg",
      "/images/avatars/avatar3.jpg",
    ];

    if (!avatars.length) return;

    function setRandomAvatar() {
      const img = document.querySelector("img.avatar.avatar-circle");

      if (!img) {
        console.log("Avatar not found yet");
        return;
      }

      // Use the pre-selected avatar from sessionStorage
      const randomAvatar = window.__selectedAvatar || avatars[Math.floor(Math.random() * avatars.length)];

      console.log(`[Avatar] Current: ${img.src}`);
      console.log(`[Avatar] Setting to: ${randomAvatar}`);
      
      // Method 1: Direct property assignment
      img.src = randomAvatar;
      
      // Method 2: Use setAttribute
      img.setAttribute("src", randomAvatar);
      
      // Remove srcset to prevent browser from picking cached versions
      img.removeAttribute("srcset");
      if (img.srcset) {
        img.srcset = "";
      }
      
      // Set width and height attributes
      img.setAttribute("width", "400");
      img.setAttribute("height", "400");
      
      // Also force via inline style
      img.style.width = "400px";
      img.style.height = "400px";
      img.style.objectFit = "cover";

      console.log(`[Avatar] Done. New src: ${img.src}`);
    }

    // Run at every critical timing
    function runSetAvatar() {
      setRandomAvatar();
      setTimeout(setRandomAvatar, 50);
      setTimeout(setRandomAvatar, 150);
      setTimeout(setRandomAvatar, 300);
      setTimeout(setRandomAvatar, 600);
      setTimeout(setRandomAvatar, 1000);
      setTimeout(setRandomAvatar, 2000);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function() {
        console.log("[Avatar] DOMContentLoaded fired");
        runSetAvatar();
      });
    }
    
    if (document.readyState !== "loading") {
      console.log("[Avatar] Running immediately (readyState=" + document.readyState + ")");
      runSetAvatar();
    }
    
    window.addEventListener("load", function() {
      console.log("[Avatar] load event fired");
      runSetAvatar();
    });
  })();
</script>
