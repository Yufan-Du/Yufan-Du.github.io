<style>
  /* Forces the author's name (admin) to be black and bold, overriding the link's default blue color. */
  .pub-authors b a {
    color: #212529 !important; /* Forces the link color to be black/dark grey */
    font-weight: 600 !important; /* Ensures it stays bold */
  }
</style>


<style>
  /* Increase avatar size for better quality display */
  img.avatar.avatar-circle {
    width: 400px !important;
    height: 400px !important;
    object-fit: cover !important;
  }
  
  /* Ensure smooth transitions */
  img.avatar.avatar-circle {
    transition: all 0.3s ease;
  }
</style>

<script>
  (function () {
    // 1) List of avatar image URLs - use high resolution versions
    const avatars = [
      "/images/avatars/avatar1.jpg",
      "/images/avatars/avatar2.jpg",
      "/images/avatars/avatar3.jpg",
    ];

    if (!avatars.length) return;

    function setRandomAvatar() {
      const img = document.querySelector("img.avatar.avatar-circle");

      if (!img) {
        console.log("Random avatar: no avatar found");
        return;
      }

      const randomIndex = Math.floor(Math.random() * avatars.length);
      const randomAvatar = avatars[randomIndex];

      console.log(`Setting avatar to: ${randomAvatar}`);
      
      // Force update and override any subsequent changes
      img.src = randomAvatar;
      img.srcset = ""; // Clear srcset
      
      // Also set the data-src if it exists (some lazy loading uses this)
      if (img.dataset.src) {
        img.dataset.src = randomAvatar;
      }
      
      // Force size via inline style
      img.style.width = "400px";
      img.style.height = "400px";
      img.style.objectFit = "cover";
    }

    // Run multiple times to ensure it takes effect despite other scripts
    function runSetAvatar() {
      setRandomAvatar();
      // Run again after a short delay in case other scripts modify the src
      setTimeout(setRandomAvatar, 100);
      setTimeout(setRandomAvatar, 500);
      setTimeout(setRandomAvatar, 1000);
    }

    if (document.readyState === "complete") {
      runSetAvatar();
    } else {
      window.addEventListener("load", runSetAvatar);
    }
    
    // Also run when DOM is ready
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", runSetAvatar);
    }
  })();
</script>
